<svg xmlns="http://www.w3.org/2000/svg" width="56" height="320" viewBox="0 0 56 320" fill="none">
  <!-- top arrow -->
  <path d="M28 6 L24 14 L28 12 L32 14 Z" fill="#171717" opacity="0.55"/>

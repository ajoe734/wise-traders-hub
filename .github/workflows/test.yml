name: Vitest

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npx vitest run

      - name: Checkup 深模組邊界守衛 (ADR-0001)
        run: npm run check:module-boundaries

      - name: ESLint
        run: npm run lint

      - name: Sitemap ↔ route consistency
        run: npx tsx scripts/sitemap-consistency-check.ts


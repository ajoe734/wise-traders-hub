name: CI — Build & E2E

# 每次推送 / PR 自動跑 TypeScript build + 關鍵 e2e，避免 TS build error 上 main。
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Type-aware production build
        run: bun run build
        env:
          # Build 需要 publishable 環境變數；用 placeholder 即可（不會打網）
          VITE_SUPABASE_URL: https://yqacmrgdjlenbijclngi.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder' }}
          VITE_SUPABASE_PROJECT_ID: yqacmrgdjlenbijclngi

  e2e:
    name: Playwright e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 推送即跑的關鍵專案；其餘 visual / RWD / live 由各自 workflow 管理。
        project:
          - desktop-share-short-link
          - desktop-share-og-card
          - desktop-share-dropdown
          - mobile-perf-overview-xaxis
          - desktop-app-expert-detail
          - desktop-expert-profile-error
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run project
        run: bunx playwright test --project=${{ matrix.project }}
        env:
          CI: 'true'
          VITE_SUPABASE_URL: https://yqacmrgdjlenbijclngi.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder' }}
          VITE_SUPABASE_PROJECT_ID: yqacmrgdjlenbijclngi
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 7

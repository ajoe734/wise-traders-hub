name: CI — Typecheck / Build / E2E

# 每次推送 / PR 自動跑 TypeScript typecheck → build → 關鍵 e2e。
# typecheck 先於 build 失敗，能更快回饋 TS 錯誤；e2e 失敗會上傳 trace/截圖/影片 artifact。
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Check ai / @ai-sdk/* version compatibility
        run: bun run check:ai-sdk-versions
      - name: tsc --noEmit
        run: bun run typecheck

  build:
    name: Build (vite)
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Type-aware production build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://yqacmrgdjlenbijclngi.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder' }}
          VITE_SUPABASE_PROJECT_ID: yqacmrgdjlenbijclngi

  e2e:
    name: Playwright e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 矩陣本身天然平行；config 內 workers=4 提供 project 內並行
        project:
          - desktop-share-short-link
          - desktop-share-og-card
          - desktop-share-dropdown
          - mobile-perf-overview-xaxis
          - desktop-app-expert-detail
          - desktop-expert-profile-error
          - desktop-freecheckup-batch-parse
          - desktop-freecheckup-batch-parse-quota
          - desktop-freecheckup-batch-parse-limit
          - desktop-freecheckup-single-parse
          - desktop-freecheckup-upload-modal
          - mobile-freecheckup-actions-sheet
          # 深模組健檢 + Shell Event Bus（docs/architecture/shell-event-bus-tdd.md §7）
          - portfolio-modules-smoke
          - module-cross-nav
          - shell-event-bus-navigation
          - shell-event-bus-nav-v2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run project
        run: bunx playwright test --project=${{ matrix.project }}
        env:
          CI: 'true'
          VITE_SUPABASE_URL: https://yqacmrgdjlenbijclngi.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder' }}
          VITE_SUPABASE_PROJECT_ID: yqacmrgdjlenbijclngi
      # 失敗時：上傳 HTML report（內含 trace.zip / 截圖 / 影片）+ 原始 test-results
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload traces / screenshots / videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results
          retention-days: 14
          if-no-files-found: ignore

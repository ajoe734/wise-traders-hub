name: ChipsSection E2E (desktop + mobile + visual + coalesce)

# 每次 PR 都自動跑 ChipsSection 四個 Playwright 專案：
#   - desktop-chips-section : e2e/chips-section.spec.ts         (11 案例 · 1280x900)
#   - mobile-chips-section  : e2e/chips-section-mobile.spec.ts  (18 案例 · 6 個手機斷點)
#   - visual-chips-section  : e2e/chips-section-visual.spec.ts  (8 個 screenshot diff 快照)
#   - desktop-chips-coalesce: e2e/chips-coalesce.spec.ts        (2 案例 · 1280x900)
# retries=2 由 playwright.config.ts 的 CI 分支提供。
# 視覺回歸失敗時，Playwright 會把 -expected / -actual / -diff.png 寫進 test-results/，
# 上傳為 chips-section-traces-visual-chips-section artifact 供 PR 直接下載比對。

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'e2e/chips-section.spec.ts'
      - 'e2e/chips-section-mobile.spec.ts'
      - 'e2e/chips-section-visual.spec.ts'
      - 'e2e/chips-coalesce.spec.ts'
      - 'e2e/chips-section-visual.spec.ts-snapshots/**'
      - 'e2e/helpers/**'
      - 'src/checkup/components/freecheckup/ChipsSection.tsx'
      - 'src/checkup/components/freecheckup/ChipsTrendChart.tsx'
      - 'src/checkup/hooks/useTwChipsDetail.ts'
      - 'src/pages/ChipsSectionHarnessEntry.tsx'
      - 'playwright.config.ts'
      - '.github/workflows/chips-section-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'e2e/chips-section.spec.ts'
      - 'e2e/chips-section-mobile.spec.ts'
      - 'e2e/chips-section-visual.spec.ts'
      - 'e2e/chips-coalesce.spec.ts'
      - 'e2e/chips-section-visual.spec.ts-snapshots/**'
      - 'e2e/helpers/**'
      - 'src/checkup/components/freecheckup/ChipsSection.tsx'
      - 'src/checkup/components/freecheckup/ChipsTrendChart.tsx'
      - 'src/checkup/hooks/useTwChipsDetail.ts'
      - 'src/pages/ChipsSectionHarnessEntry.tsx'
      - 'playwright.config.ts'
      - '.github/workflows/chips-section-e2e.yml'
  workflow_dispatch:

concurrency:
  group: chips-section-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://yqacmrgdjlenbijclngi.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder' }}
  VITE_SUPABASE_PROJECT_ID: yqacmrgdjlenbijclngi

jobs:
  chips-section:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chips-section, mobile-chips-section, visual-chips-section, desktop-chips-coalesce]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ---- bun install 快取（key 綁定 OS 版本，避免升級 runner 後拿到不相容的二進位）----
      - name: Resolve runner image tag
        id: runner-img
        run: echo "tag=$(lsb_release -sr 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Cache bun store
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ steps.runner-img.outputs.tag }}-bun-${{ hashFiles('bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.runner-img.outputs.tag }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Verify @playwright/test present
        run: |
          if [ ! -f node_modules/@playwright/test/package.json ]; then
            echo "::error::@playwright/test missing after bun install"
            exit 1
          fi

      # ---- Playwright browsers 快取（key 綁定 OS + PW 版本）----
      - name: Get Playwright version
        id: pw-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.runner-img.outputs.tag }}-playwright-${{ steps.pw-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.runner-img.outputs.tag }}-playwright-

      - name: Install Playwright chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install chromium system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # ---- 快取完整性驗證：只要 chromium 二進位缺失就強制重灌，避免部分快取造成 CI 紅燈 ----
      - name: Verify Playwright chromium binary
        id: pw-verify
        run: |
          set -e
          bin=$(bunx playwright install --dry-run chromium 2>/dev/null | awk '/Install location:/ {print $3; exit}')
          echo "install_location=$bin"
          if [ -z "$bin" ] || [ ! -d "$bin" ]; then
            echo "needs_reinstall=true" >> "$GITHUB_OUTPUT"
          else
            headless=$(find "$bin" -maxdepth 3 -type f \( -name 'headless_shell' -o -name 'chrome' \) | head -n1)
            if [ -z "$headless" ]; then
              echo "needs_reinstall=true" >> "$GITHUB_OUTPUT"
            else
              echo "needs_reinstall=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Reinstall chromium (integrity failure)
        if: steps.pw-verify.outputs.needs_reinstall == 'true'
        run: |
          echo "::warning::Playwright chromium cache incomplete, reinstalling"
          rm -rf ~/.cache/ms-playwright
          bunx playwright install --with-deps chromium

      # ---- 字型：Noto CJK + emoji，確保繁中/emoji 視覺快照跨機一致 ----
      - name: Install CJK & emoji fonts
        run: |
          set -e
          need_install=false
          for pkg in fonts-noto-cjk fonts-noto-color-emoji; do
            dpkg -s "$pkg" >/dev/null 2>&1 || need_install=true
          done
          if [ "$need_install" = "true" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji
            sudo fc-cache -f
          fi
          fc-list :lang=zh-tw | head -n3

      - name: Smoke check chromium launch
        run: |
          bunx playwright --version
          node -e "const {chromium}=require('playwright');chromium.launch().then(b=>b.close()).then(()=>console.log('chromium OK'))"

      # ---- 執行對應 project ----
      - name: Run ${{ matrix.project }}
        run: bunx playwright test --project=${{ matrix.project }}
        env:
          CI: 'true'

      # ---- HTML 報告：每個 project 各自一份 artifact ----
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chips-section-html-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

      # ---- 失敗定位：把 test-results 內每個檔案改名為
      #       <sha7>__<project>__<caseSlug>__<原檔名>
      #      caseSlug 直接取 Playwright 為每個失敗 case 建立的資料夾名（已含 spec 與 test title）。
      - name: Rebrand failure artifacts with SHA + case name
        if: failure()
        run: |
          set -euo pipefail
          SHA7="${GITHUB_SHA::7}"
          PROJECT="${{ matrix.project }}"
          OUT_DIR="failure-artifacts/${SHA7}-${PROJECT}"
          mkdir -p "$OUT_DIR"
          if [ ! -d test-results ]; then
            echo "no test-results directory, skip"
            exit 0
          fi
          # 逐個 case 資料夾（e.g. test-results/chips-section-visual-Chips-...-visual-chips-section）
          while IFS= read -r -d '' case_dir; do
            case_slug="$(basename "$case_dir")"
            # 限制檔名長度，避免超過 filesystem 上限
            case_short="${case_slug:0:120}"
            while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              new="${SHA7}__${PROJECT}__${case_short}__${base}"
              cp "$f" "$OUT_DIR/$new"
            done < <(find "$case_dir" -maxdepth 1 -type f \( \
                -name 'trace*.zip' -o \
                -name 'video*.webm' -o \
                -name '*.png' -o \
                -name 'error-context.md' \
              \) -print0)
          done < <(find test-results -mindepth 1 -maxdepth 1 -type d -print0)
          echo "---- rebranded artifacts ----"
          ls -lh "$OUT_DIR" || true

      - name: Upload failure artifacts (SHA + case named)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # commit SHA 也放進 artifact 名，PR 有多次 rerun 時不會互相覆蓋
          name: chips-fail-${{ github.sha }}-${{ matrix.project }}
          path: failure-artifacts
          retention-days: 30
          if-no-files-found: ignore

      # ---- 保留原始 test-results 完整目錄，方便本地 `npx playwright show-trace` ----
      - name: Upload raw test-results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chips-section-traces-${{ matrix.project }}-${{ github.sha }}
          path: test-results
          retention-days: 14
          if-no-files-found: ignore

      # ---- 視覺回歸專用：只挑 -expected / -actual / -diff.png 打包，方便快速看差異 ----
      - name: Collect visual diff PNGs (visual project only, on failure)
        if: failure() && matrix.project == 'visual-chips-section'
        run: |
          set -euo pipefail
          SHA7="${GITHUB_SHA::7}"
          mkdir -p visual-diff
          if [ -d test-results ]; then
            while IFS= read -r -d '' f; do
              case_slug="$(basename "$(dirname "$f")")"
              case_short="${case_slug:0:120}"
              base="$(basename "$f")"
              cp "$f" "visual-diff/${SHA7}__${case_short}__${base}"
            done < <(find test-results -type f \( \
                -name '*-expected.png' -o \
                -name '*-actual.png'   -o \
                -name '*-diff.png' \
              \) -print0)
          fi
          ls -lh visual-diff || true

      - name: Upload visual diff PNGs (visual project only, on failure)
        if: failure() && matrix.project == 'visual-chips-section'
        uses: actions/upload-artifact@v4
        with:
          name: chips-visual-diff-${{ github.sha }}
          path: visual-diff
          retention-days: 30
          if-no-files-found: ignore


  # 三個 project 都綠才算通過，可做為分支保護 required check
  chips-section-passed:
    name: ChipsSection E2E passed (required)
    runs-on: ubuntu-latest
    needs: [chips-section]
    if: always()
    steps:
      - name: Fail if any project failed or was cancelled
        run: |
          if [ "${{ needs.chips-section.result }}" != "success" ]; then
            echo "chips-section matrix result=${{ needs.chips-section.result }}"
            exit 1
          fi
          echo "desktop + mobile + visual + coalesce chips-section all passed."


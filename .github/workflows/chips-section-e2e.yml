name: ChipsSection E2E (desktop + mobile + visual)

# 每次 PR 都自動跑 ChipsSection 三個 Playwright 專案：
#   - desktop-chips-section : e2e/chips-section.spec.ts         (11 案例 · 1280x900)
#   - mobile-chips-section  : e2e/chips-section-mobile.spec.ts  (18 案例 · 6 個手機斷點)
#   - visual-chips-section  : e2e/chips-section-visual.spec.ts  (8 個 screenshot diff 快照)
# retries=2 由 playwright.config.ts 的 CI 分支提供。
# 視覺回歸失敗時，Playwright 會把 -expected / -actual / -diff.png 寫進 test-results/，
# 上傳為 chips-section-traces-visual-chips-section artifact 供 PR 直接下載比對。

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'e2e/chips-section.spec.ts'
      - 'e2e/chips-section-mobile.spec.ts'
      - 'e2e/chips-section-visual.spec.ts'
      - 'e2e/chips-section-visual.spec.ts-snapshots/**'
      - 'e2e/helpers/**'
      - 'src/checkup/components/freecheckup/ChipsSection.tsx'
      - 'src/checkup/components/freecheckup/ChipsTrendChart.tsx'
      - 'src/checkup/hooks/useTwChipsDetail.ts'
      - 'src/pages/ChipsSectionHarnessEntry.tsx'
      - 'playwright.config.ts'
      - '.github/workflows/chips-section-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'e2e/chips-section.spec.ts'
      - 'e2e/chips-section-mobile.spec.ts'
      - 'e2e/chips-section-visual.spec.ts'
      - 'e2e/chips-section-visual.spec.ts-snapshots/**'
      - 'e2e/helpers/**'
      - 'src/checkup/components/freecheckup/ChipsSection.tsx'
      - 'src/checkup/components/freecheckup/ChipsTrendChart.tsx'
      - 'src/checkup/hooks/useTwChipsDetail.ts'
      - 'src/pages/ChipsSectionHarnessEntry.tsx'
      - 'playwright.config.ts'
      - '.github/workflows/chips-section-e2e.yml'
  workflow_dispatch:

concurrency:
  group: chips-section-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://yqacmrgdjlenbijclngi.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder' }}
  VITE_SUPABASE_PROJECT_ID: yqacmrgdjlenbijclngi

jobs:
  chips-section:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chips-section, mobile-chips-section, visual-chips-section]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ---- bun install 快取 ----
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      # ---- Playwright chromium 快取 ----
      - name: Get Playwright version
        id: pw-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install chromium system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # ---- 執行對應 project ----
      - name: Run ${{ matrix.project }}
        run: bunx playwright test --project=${{ matrix.project }}
        env:
          CI: 'true'

      # ---- HTML 報告：每個 project 各自一份 artifact ----
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chips-section-html-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces / screenshots / videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chips-section-traces-${{ matrix.project }}
          path: test-results
          retention-days: 14
          if-no-files-found: ignore

  # 兩個 project 都綠才算通過，可做為分支保護 required check
  chips-section-passed:
    name: ChipsSection E2E passed (required)
    runs-on: ubuntu-latest
    needs: [chips-section]
    if: always()
    steps:
      - name: Fail if any project failed or was cancelled
        run: |
          if [ "${{ needs.chips-section.result }}" != "success" ]; then
            echo "chips-section matrix result=${{ needs.chips-section.result }}"
            exit 1
          fi
          echo "desktop-chips-section + mobile-chips-section both passed."

name: Full Tests (Vitest + Playwright)

# 在每次 push / PR 都完整跑 vitest 全套 + Playwright 全 project。
# 最終彙總 job `all-tests-passed` 為分支保護規則的 required check，
# 任一子 job 失敗都會讓合併按鈕變灰。

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: full-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://yqacmrgdjlenbijclngi.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder' }}
  VITE_SUPABASE_PROJECT_ID: yqacmrgdjlenbijclngi

jobs:
  vitest:
    name: Vitest (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Run vitest
        run: bunx vitest run --reporter=default
      - name: Upload vitest logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-logs
          path: |
            coverage
            test-results
          retention-days: 7
          if-no-files-found: ignore

  playwright:
    name: Playwright shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Run Playwright (shard ${{ matrix.shard }}/6)
        run: bunx playwright test --shard=${{ matrix.shard }}/6
        env:
          CI: 'true'
      - name: Upload Playwright HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload traces / screenshots / videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: test-results
          retention-days: 14
          if-no-files-found: ignore

  all-tests-passed:
    name: All tests passed (required)
    runs-on: ubuntu-latest
    needs: [vitest, playwright]
    if: always()
    steps:
      - name: Fail if any dependency failed or was cancelled
        run: |
          if [ "${{ needs.vitest.result }}" != "success" ] || [ "${{ needs.playwright.result }}" != "success" ]; then
            echo "vitest=${{ needs.vitest.result }} playwright=${{ needs.playwright.result }}"
            exit 1
          fi
          echo "All test jobs passed."
